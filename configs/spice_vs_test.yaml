version: "0.1.0"
experiment_name: spice2_vs_test
experiment_description: Fit to SPICE 2 (filtered out larger forces) with linearised harmonics, with minibatching, starting from a force field with virtual sites. Purely a test of the VS infrastructure.
data_dir: data/spice2
get_data_fn: descent_workflow.get_data.get_data_spice2_force_filtered
get_data_output_smiles: data/spice2/smiles_test_train.json
starting_force_field_path: input_ff/vsites_test.offxml
filter_and_cluster_fn: descent_workflow.filter.filter_spice2
batch_size: 600
n_epochs: 15
learning_rate: 0.02
energy_weight: 1.0
force_weight: 1.0
torsion_weight: 0.0
torsion_reg: l1
minibatch_size: 256
attributes: {}
parameters:
  LinearBonds:
    cols:
    - k1
    - k2
    scales:
      k1: 0.0028
      k2: 0.0028
    limits:
      k1:
      - 1E-8
      - null
      k2:
      - 1E-8
      - null
  LinearAngles:
    cols:
    - k1
    - k2
    scales:
      k1: 0.012
      k2: 0.011
    limits:
      k1:
      - 1E-8
      - null
      k2:
      - 1E-8
      - null
  ProperTorsions:
    cols:
    - k
    scales:
      k: 1.3
    exclude:
    - id: '[*:1]-[*:2]#[*:3]-[*:4]'
      mult: 0
      associated_handler: ProperTorsions
      bond_order: null
    - id: '[*:1]~[*:2]-[*:3]#[*:4]'
      mult: 0
      associated_handler: ProperTorsions
      bond_order: null
    - id: '[*:1]~[*:2]=[#6,#7,#16,#15;X2:3]=[*:4]'
      mult: 0
      associated_handler: ProperTorsions
      bond_order: null
  ImproperTorsions:
    cols:
    - k
    scales:
      k: 0.12
