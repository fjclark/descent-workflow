experiment_name: spice2_linearised_harmonics_minibatch_neutral
experiment_description: Fit to SPICE 2 (filtered out larger forces) with linearised harmonics, with minibatching (size 256), and only fit to neutral molecules.
data_dir: data/spice2
get_data_fn: get_data.get_data_spice2_force_filtered
get_data_output_smiles: data/spice2/smiles_test_train.json
starting_force_field_path: input_ff/lj-sage-2-2-msm-0-expanded-torsions-neutral.offxml
filter_and_cluster_fn: filter.filter_neutral_spice2
batch_size: 600
n_epochs: 15
learning_rate: 0.02
energy_weight: 1.0
force_weight: 1.0
torsion_weight: 0.0
torsion_reg: l1
minibatch_size: 256
attributes: {}
parameters:
  LinearBonds:
    cols:
    - k1
    - k2
    scales:
      k1: 0.0014
      k2: 0.058
    limits:
      k1:
      - null
      - null
      k2:
      - null
      - null
  LinearAngles:
    cols:
    - k1
    - k2
    scales:
      k1: 0.016
      k2: 0.0091
    limits:
      k1:
      - null
      - null
      k2:
      - null
      - null
  ProperTorsions:
    cols:
    - k
    scales:
      k: 1.3
  ImproperTorsions:
    cols:
    - k
    scales:
      k: 0.23
