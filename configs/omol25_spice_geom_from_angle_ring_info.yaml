version: "0.1.0"
experiment_name: omol25_spice_geom_from_angle_ring_info
experiment_description: Fit to combined reprocessed OMol25 SPICE + GEOM (stereo-collapsed, min 5 conformers) starting from the angle_ring_info FF, with linearised harmonics and minibatching, and no new type generation.
data_dir: data/omol25_spice_geom
get_data_fn: descent_workflow.get_data.get_data_omol25_combined
get_data_output_smiles: data/omol25_spice_geom/smiles_test_train.json
starting_force_field_path: output_ff/spice2_linearised_harmonics_minibatch_rerun_angle_ring_info.offxml
filter_and_cluster_fn: descent_workflow.filter.filter_spice2
batch_size: 600
n_epochs: 5
learning_rate: 0.02
energy_weight: 1.0
force_weight: 1.0
torsion_weight: 0.0
torsion_reg: l1
minibatch_size: 256
attributes: {}
parameters:
  LinearBonds:
    cols:
    - k1
    - k2
    scales:
      k1: 0.0028
      k2: 0.0028
    limits:
      k1:
      - 1E-8
      - null
      k2:
      - 1E-8
      - null
  LinearAngles:
    cols:
    - k1
    - k2
    scales:
      k1: 0.012
      k2: 0.011
    limits:
      k1:
      - 1E-8
      - null
      k2:
      - 1E-8
      - null
  ProperTorsions:
    cols:
    - k
    scales:
      k: 1.3
    exclude:
    - id: '[*:1]-[*:2]#[*:3]-[*:4]'
      mult: 0
      associated_handler: ProperTorsions
      bond_order: null
    - id: '[*:1]~[*:2]-[*:3]#[*:4]'
      mult: 0
      associated_handler: ProperTorsions
      bond_order: null
    - id: '[*:1]~[*:2]=[#6,#7,#16,#15;X2:3]=[*:4]'
      mult: 0
      associated_handler: ProperTorsions
      bond_order: null
  ImproperTorsions:
    cols:
    - k
    scales:
      k: 0.12
